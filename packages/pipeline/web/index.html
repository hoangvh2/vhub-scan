<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--VH_MODE-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<title>VHub Trend Scan</title>
<style>
/* Design tokens. Shared with the Android app (android/app/.../ui/Theme.kt): paper neutrals, one vermilion accent,
   green only for "kept", amber only for "snoozed". Change both places together. */
:root{
  --bg:#f4f3ef;--surface:#fbfaf7;--raised:#fff;--ink:#1c1b18;--ink2:#4a4842;--mute:#77746b;--line:#e2dfd6;--line2:#cfcbc0;
  --accent:#b5461f;--accent-ink:#fff;--accent-soft:#f6e6dd;--pos:#2f6b45;--pos-soft:#e3efe6;--warn:#8a6100;--warn-soft:#f5ecd3;--neg:#a32d23;
  --r:8px;--shadow:0 1px 0 rgba(28,27,24,.04),0 8px 24px -12px rgba(28,27,24,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412;--surface:#1a1a17;--raised:#211f1c;--ink:#ebe8e0;--ink2:#c4c0b5;--mute:#918d82;--line:#2c2b27;--line2:#3c3a34;
  --accent:#e2805a;--accent-ink:#1a0e08;--accent-soft:#3a2419;--pos:#86c39a;--pos-soft:#1c2d22;--warn:#d9b45a;--warn-soft:#352b14;--neg:#ec8f84;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Shell: rail | list | detail on desktop; top bar + list + sheet + tab bar on phones. */
.app{display:grid;grid-template-columns:232px minmax(340px,1fr) minmax(400px,1.25fr);height:100vh;height:100dvh}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:18px;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--ink2)}
.nav button:hover{background:var(--bg)}
.nav button[aria-selected=true]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button[aria-selected=true] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;color:var(--mute)}
.nav kbd{display:none}
.status{margin-top:auto;display:grid;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.status .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--pos)}.dot.bad{background:var(--neg)}.dot.run{background:var(--warn)}
.tok{display:grid;gap:4px}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.meter>i{display:block;height:100%;background:var(--ink2)}
.meter.hot>i{background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:var(--ink2)}
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.keep[aria-pressed=true]{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg);border-color:var(--line)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}

.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.list{border-right:1px solid var(--line)}
.phead{padding:16px 18px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.phead h1{font-size:18px;margin:0;letter-spacing:-.01em}
.phead .sub{font-size:12.5px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--raised)}
.search[hidden]{display:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}

.rows{list-style:none;margin:0;padding:6px 0}
.rowi{display:grid;grid-template-columns:20px 1fr auto;gap:2px 12px;padding:10px 18px;border-left:2px solid transparent;cursor:pointer;align-items:start}
.rowi:hover{background:var(--surface)}
.rowi[aria-selected=true]{background:var(--surface);border-left-color:var(--accent)}
.rowi .t{font-weight:600;font-size:14px;overflow-wrap:anywhere;line-height:1.3}
.rowi .w{grid-column:2/4;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rowi .m{grid-column:2/4;display:flex;gap:10px;font-size:12px;color:var(--mute)}
.rowi .m:empty{display:none}
.rowi .m .st{color:var(--pos);font-weight:600}.rowi .m .st.snoozed{color:var(--warn)}
.rowi .delta{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;padding-top:1px}
.rowi .delta b{color:var(--ink);font-weight:600}
.score{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--mute);margin-top:-1px}
.score.s2{color:var(--ink);border-color:var(--ink2)}
.score.s3{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.detail{background:var(--surface)}
.dbody{padding:22px 26px 28px;display:grid;gap:20px;max-width:720px}
.dtop{display:grid;gap:8px}
.dtop h2{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.dtop .desc{color:var(--ink2);font-size:14.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:600}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 14px;font-size:17px;line-height:1.4;font-weight:500}
.why small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.glance{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2)}
.glance b{color:var(--ink);font-weight:600}
.todo{display:grid;gap:8px}
.todo .one{font-size:15px;color:var(--ink)}
.todo ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.todo li{font-size:14px;color:var(--ink2);padding-left:14px;position:relative}
.todo li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.todo li b{color:var(--ink);font-weight:600}
.more{border-top:1px solid var(--line);padding-top:4px}
.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;color:var(--ink2);font-size:13.5px;font-weight:600}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px;transition:transform .15s}
.more[open]>summary::after{transform:rotate(-135deg)}
.more>div{display:grid;gap:20px;padding:6px 0 4px}
.more .raw{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.cardgrid{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:0}
.cardgrid dt{color:var(--mute);font-size:12.5px;padding-top:1px}
.cardgrid dd{margin:0}
.apply{display:grid;gap:6px}
.apply div b{font-weight:600}
.effort{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.effort i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line2)}
.effort i.on{background:var(--ink2);border-color:var(--ink2)}
.chart{display:grid;gap:6px}
.chart svg{width:100%;height:84px;color:var(--ink2)}
.chart .leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.evi{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.evi li{display:flex;gap:10px;align-items:baseline}
.evi .src{font-family:var(--mono);font-size:11.5px;color:var(--mute);min-width:52px}
.evi a{overflow-wrap:anywhere}
.acts{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:12px 26px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.acts .sp{flex:1}
.back{display:none}

.empty{padding:48px 26px;display:grid;gap:10px;justify-items:start;max-width:460px}
.empty h3{margin:0;font-size:15px}
.empty p{margin:0;color:var(--ink2)}
.empty code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.sk{list-style:none;margin:0;padding:6px 0}
.sk li{padding:12px 18px;display:grid;gap:7px}
.sk i{display:block;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--line) 0,var(--surface) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk i{animation:none}}

/* System view: full width under the list header. */
.sys{padding:18px;display:grid;gap:14px;align-content:start;max-width:980px}
.sys .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.tile small{font-size:12px;color:var(--mute)}
.tile b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tile .meter{margin-top:4px}
.tile.bad b{color:var(--neg)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.panel h3{margin:0;font-size:13px;font-weight:600}
.panel .hint{font-size:12.5px;color:var(--mute)}
.funnel{display:grid;gap:5px}
.funnel div{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
.funnel span{color:var(--ink2)}
.funnel em{font-style:normal;text-align:right}
.funnel i{display:block;height:8px;border-radius:2px;background:var(--ink2);min-width:2px}
.funnel div:last-child i{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
.alert{font-size:12.5px;border-radius:6px;padding:8px 10px;background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.qr{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:start}
.qr .code{background:#fff;border-radius:6px;padding:6px;border:1px solid var(--line)}
.qr .code svg{display:block;width:100%;height:auto}
.qr ol{margin:0;padding-left:18px;font-size:14px;display:grid;gap:6px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:opacity .15s,transform .15s;z-index:20;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{all:unset;cursor:pointer;color:var(--accent-soft);font-weight:600;padding:4px 8px;border-radius:4px}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent)}}
.keyhelp{padding:0 8px}.keyhelp>summary{cursor:pointer;font-size:12px;color:var(--mute);list-style:none}.keyhelp>summary::-webkit-details-marker{display:none}.keyhelp[open]>summary{margin-bottom:8px}
@media (hover:none){.keyhelp{display:none}}
.keys{font-size:12px;color:var(--mute);padding:0 8px;margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center}
.keys dt{white-space:nowrap}.keys dd{margin:0}
.keys kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink2)}
.tabbar,.topbar{display:none}
.app.is-system .list{grid-column:2/4;border-right:0}
.app.is-system .detail{display:none}

/* Medium: rail collapses to icons. */
@media (max-width:1180px){
  .app{grid-template-columns:64px minmax(320px,1fr) minmax(380px,1.2fr)}
  .rail{padding:14px 8px;align-items:center}
  .brand span,.brand b,.nav .label,.nav .count,.status .txt,.status .tok,.keys,.keyhelp{display:none}
  .brand::before{content:"VH";font-weight:700;font-size:13px}
  .nav button{justify-content:center;width:40px;height:36px;padding:0}
  .status{padding:10px 0 0;justify-items:center}
  .status .meter{width:36px}
}
@media (hover:none),(pointer:coarse){.keys{display:none}}

/* Phone and small tablet: list full width, detail as a sheet, tab bar at the bottom. */
@media (max-width:820px){
  body{font-size:15px}
  .app{display:block;height:auto;min-height:100vh;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar b{font-size:16px}
  .topbar .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
  .list{border-right:0}
  .phead{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .phead h1{font-size:20px}
  .scroll{overflow:visible}
  .rowi{padding:12px 16px}
  .rowi .t{font-size:15px}
  .rowi .w{font-size:14px}
  .detail{position:fixed;inset:0;z-index:10;transform:translateX(100%);transition:transform .2s ease;visibility:hidden}
  body.sheet .detail{transform:none;visibility:visible}
  .detail .scroll{overflow:auto}
  .back{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
  .dbody{padding:18px 16px 24px}
  .dtop h2{font-size:21px}
  .cardgrid{grid-template-columns:1fr;gap:2px}
  .cardgrid dd{margin-bottom:10px}
  .acts{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .acts .btn{height:40px;flex:1}
  .acts .sp{display:none}
  .sys{padding:14px 16px}
  .tiles{grid-template-columns:1fr 1fr 1fr;gap:8px}.tile{padding:10px}.tile b{font-size:16px}
  .qr{grid-template-columns:1fr}
  .qr .code{max-width:240px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--mute)}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-selected=true]{color:var(--ink);font-weight:600}
  .tabbar button[aria-selected=true] svg{color:var(--accent)}
  #toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  body.sheet #toast{bottom:calc(72px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.hosted #runnow, .hosted #runnow2 { display: none; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10.5" rx="1.5"/><path d="M2.5 6.5h11M5.5 1.8v2.4M10.5 1.8v2.4"/></symbol>
  <symbol id="i-kept" viewBox="0 0 16 16"><path d="M4 2.5h8v11l-4-2.8-4 2.8z"/></symbol>

  <symbol id="i-system" viewBox="0 0 16 16"><path d="M2 12.5h12M4 12.5V8M8 12.5V3.5M12 12.5V6"/></symbol>
  <symbol id="i-run" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.8h-2.8"/></symbol>

<div class="app" id="app">
  <aside class="rail" aria-label="Điều hướng">
    <div class="brand"><b>VHub Trend</b><span>Scan</span></div>
    <nav class="nav" id="nav" role="tablist" aria-label="Màn hình"></nav>
    <details class="keyhelp"><summary>Phím tắt</summary><dl class="keys" aria-label="Phím tắt"><dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>lên, xuống</dd><dt><kbd>E</kbd> <kbd>X</kbd> <kbd>S</kbd></dt><dd>giữ, bỏ, hoãn</dd><dt><kbd>O</kbd></dt><dd>mở trang gốc</dd><dt><kbd>/</kbd></dt><dd>tìm</dd><dt><kbd>1</kbd>–<kbd>4</kbd></dt><dd>đổi màn hình</dd></dl></details>
    <div class="status" id="status"></div>
  </aside>

  <header class="topbar">
    <b>VHub Trend</b>
    <span class="st" id="topstatus"></span>
    <button class="btn ghost sm" id="runnow2" aria-label="Chạy ngay"><svg class="i"><use href="#i-run"/></svg></button>
  </header>

  <section class="pane list" aria-labelledby="ptitle">
    <div class="phead">
      <div><h1 id="ptitle">Hôm nay</h1><div class="sub" id="psub"></div></div>
      <label class="search" id="searchbox" hidden><svg class="i" aria-hidden="true"><use href="#i-explore"/></svg><span class="sr">Tìm</span><input id="q" type="search" placeholder="Tìm theo tên, mô tả, chủ đề" autocomplete="off"></label>
    </div>
    <div class="scroll" id="listview" aria-live="polite"></div>
  </section>

  <section class="pane detail" id="detail" aria-label="Chi tiết">
    <div class="back"><button class="btn ghost" id="closesheet"><svg class="i"><use href="#i-back"/></svg>Danh sách</button></div>
    <div class="scroll" id="detailview"></div>
    <div class="acts" id="acts" hidden></div>
  </section>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Màn hình"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const TABS = [
  { k: "today", t: "Hôm nay", icon: "today" },
  { k: "kept", t: "Đã giữ", icon: "kept" },
  { k: "explore", t: "Khám phá", icon: "explore" },
  { k: "system", t: "Hệ thống", icon: "system" },
];
const STATE_LABEL = { new: "Mới", kept: "Đã giữ", skipped: "Đã bỏ", snoozed: "Đang hoãn", trying: "Đang thử", done: "Xong" };

const phone = matchMedia("(max-width: 820px)");

// Two ways to run this page. On the PC (`npm run dashboard`) it talks to the local server with a token. Hosted on
// Firebase Hosting (scripts/build-hosting.mjs sets VH_CLOUD) it reads the snapshot the PC published to Firestore.
const CLOUD = window.VH_CLOUD === true;

// The token arrives once in the URL (printed by `trend serve`), is kept in this browser, and removed from the address bar.
const url = new URL(location.href);
if (!CLOUD && url.searchParams.get("t")) { try { localStorage.setItem("trendToken", url.searchParams.get("t")); } catch {} url.searchParams.delete("t"); history.replaceState(null, "", url.pathname); }
const token = (() => { try { return localStorage.getItem("trendToken") || ""; } catch { return ""; } })();

class AuthError extends Error {}
async function api(path, opt = {}) {
  if (CLOUD) return cloudApi(path, opt);
  const r = await fetch(path, { ...opt, headers: { authorization: "Bearer " + token, "content-type": "application/json" } });
  if (r.status === 401) throw new AuthError("Trình duyệt này chưa có mã truy cập.");
  if (!r.ok && r.status !== 202 && r.status !== 409) throw new Error("Máy chủ trả lỗi " + r.status);
  return r.json();

/* ---------- hosted mode: Firebase Auth + Firestore over REST (same contract as the phone app, docs/SYNC.md) ---------- */
const EP = Object.assign({ auth: "https://identitytoolkit.googleapis.com", token: "https://securetoken.googleapis.com", fs: "https://firestore.googleapis.com" }, window.VH_ENDPOINTS || {});

  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const cloud = {
  session: store.get("vhSession"), snap: null, snapAt: 0, ready: null,
  /** The pairing link carries a one-hour custom token in the #fragment (never sent to a server). Exchange it once. */

    if (!m) return Promise.resolve();
    history.replaceState(null, "", location.pathname + location.search);
    return (async () => {

      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new AuthError("Liên kết đã hết hạn hoặc không dùng được (" + ((j.error && j.error.message) || r.status) + "). Tạo lại trên PC: npm run pair");

    })();
  },
  async idToken() {
    const s = this.session;

    if (s.id && Date.now() < s.until) return s.id;
    const r = await fetch(`${EP.token}/v1/token?key=${encodeURIComponent(s.k)}`, { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(s.refresh) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { this.session = null; store.set("vhSession", null); throw new AuthError("Phiên đăng nhập đã hết hạn. Tạo lại liên kết trên PC: npm run pair"); }

  },
  docs() { return `${EP.fs}/v1/projects/${this.session.p}/databases/(default)/documents/owners/${this.session.u}`; },

    if (r.status === 401 || r.status === 403) throw new AuthError("Cloud từ chối trình duyệt này. Tạo lại liên kết trên PC: npm run pair");
    if (!r.ok) throw new Error("Cloud trả lỗi " + r.status);

  async snapshot(force) {

    return this.snap;
  },
  overlay() {
    const gen = this.snap ? Date.parse(this.snap.generatedAt) || 0 : 0;
    const all = store.get("vhOverlay") || [];

    if (live.length !== all.length) store.set("vhOverlay", live);
    return new Map(live.map((o) => [o.id, o]));

  /** The snapshot with the user's not-yet-synced actions applied. */
  view() {

  async send(id, action, days) {
    const idt = await this.idToken();

    const at = Date.now();

    if (action === "snooze") fields.days = { integerValue: String(days || 7) };
    const r = await fetch(`${this.docs()}/inbox?documentId=${eventId}`, { method: "POST", headers: { authorization: "Bearer " + idt, "content-type": "application/json" }, body: JSON.stringify({ fields }) });
    if (!r.ok && r.status !== 409) throw new Error("Cloud trả lỗi " + r.status);

};
async function cloudApi(path, opt) {

    const h = v.s.health, lr = h.lastRun;

/* ---------- toast with undo ---------- */
function toast(text, undo) {
  const t = $("#toast"); t.replaceChildren(h("span", {}, text));
  if (undo) t.append(h("button", { onclick: () => { t.classList.remove("on"); undo(); } }, "Hoàn tác"));
  t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 6000);
}

/* ---------- actions (non-destructive: every one can be undone) ---------- */
const BACK = { new: "reset", kept: "keep", skipped: "skip", snoozed: "snooze", trying: "trying", done: "done" };
async function act(it, action, label) {
  if (!it) return;
  const prev = it.userState;
  try {
    await api("/api/feedback", { method: "POST", body: JSON.stringify({ id: it.id, action, days: 7 }) });
  } catch (e) { return toast("Chưa lưu được: " + e.message); }
  toast(label, async () => { await api("/api/feedback", { method: "POST", body: JSON.stringify({ id: it.id, action: BACK[prev] || "reset" }) }); load(); });
  // Leaving the current list moves the selection to the next item, so triage stays one key per item.
  await load({ keepIndex: true });
}
function actionsFor(it) {
  if (!it) return [];
  if (ui.tab === "kept") return [
    ["trying", "Đang thử", "check", "Đã chuyển sang Đang thử", it.userState === "trying"],
    ["done", "Xong", "check", "Đã đánh dấu xong"],
    ["skip", "Bỏ", "x", "Đã bỏ"],
  ];
  return [
    ["keep", "Giữ", "check", "Đã giữ", it.userState === "kept"],
    ["skip", "Bỏ", "x", "Đã bỏ"],
    ["snooze", "Hoãn", "clock", "Sẽ hiện lại sau 7 ngày"],
  ];
}

/* ---------- navigation ---------- */
function renderNav() {
  const counts = ui.health ? { today: ui.health.digestCount, kept: (ui.health.userStates.kept || 0) + (ui.health.userStates.trying || 0), explore: ui.health.userStates.new || 0 } : {};
  const mk = (rail) => TABS.map((t, i) => h("button", {
    role: "tab", "aria-selected": String(ui.tab === t.k), title: rail ? `${t.t} (${i + 1})` : null,
    onclick: () => go(t.k),
  }, icon(t.icon), h("span", { class: "label" }, t.t), rail && counts[t.k] != null ? h("span", { class: "count num" }, fmt.format(counts[t.k])) : null));

  $("#tabbar").replaceChildren(...mk(false));
}
function go(tab) {
  if (ui.tab === tab) return;
  ui.tab = tab; ui.sel = 0; closeSheet(true);
  $("#q").value = "";
  load();
}

/* ---------- status (rail + phone top bar) ---------- */
function renderStatus() {
  const s = ui.health; const box = $("#status");
  if (!s) { box.replaceChildren(); $("#topstatus").replaceChildren(); return; }
  const r = s.lastRun; const used = s.tokens.inTokens + s.tokens.outTokens; const pct = Math.min(100, Math.round(used / Math.max(1, s.tokens.limit) * 100));
  const cls = !r ? "" : r.status === "ok" ? "ok" : r.status === "running" ? "run" : r.status === "failed" ? "bad" : "run";
  const runText = !r ? "Chưa chạy lần nào" : r.status === "running" ? "Đang chạy…" : (r.status === "ok" ? "Quét " : "Lỗi · ") + ago(r.started_at);
  const sync = s.cloud ? (s.cloud.last ? (s.cloud.last.ok ? "Cloud · " + ago(s.cloud.last.at) : "Cloud lỗi") : "Cloud · chưa đồng bộ") : null;
  box.replaceChildren(
    h("div", { class: "row", title: r && r.error ? r.error : null }, h("span", { class: "dot " + cls }), h("span", { class: "txt" }, runText)),
    sync && h("div", { class: "row" }, h("span", { class: "dot " + (s.cloud.last && !s.cloud.last.ok ? "bad" : s.cloud.last ? "ok" : "") }), h("span", { class: "txt" }, sync)),
    h("div", { class: "tok" }, h("div", { class: "row" }, h("span", {}, "Token hôm nay"), h("span", { class: "num", style: "margin-left:auto" }, pct + "%")), h("div", { class: "meter" + (pct > 85 ? " hot" : "") }, h("i", { style: `width:${pct}%` }))),
    h("button", { class: "btn", id: "runnow", onclick: runNow, title: "Chạy ngay một lần quét" }, icon("run"), h("span", { class: "txt" }, "Chạy ngay")),
  );
  $("#topstatus").replaceChildren(h("span", { class: "dot " + cls }), runText);
}
async function runNow() {
  try {
    const r = await api("/api/run", { method: "POST", body: "{}" });
    toast(r.started ? "Đã bắt đầu quét. Danh sách tự cập nhật khi xong." : "Chưa chạy được: " + (r.reason === "already running" ? "đang có lần quét khác" : r.reason || "không rõ"));

/* ---------- list ---------- */
function scoreBars(n) {

  return h("span", { class: "score s" + s, title: n == null ? "Chưa chấm" : `Điểm AI ${s}/3`, "aria-label": n == null ? "Chưa chấm" : `Điểm ${s} trên 3` }, n == null ? "–" : String(s));
}

}

    h("div", { class: "w" }, it.triage.why || it.description),

}

function renderList() {

            : empty("Chưa quét lần nào", "Chạy lần quét đầu tiên trong terminal, hoặc bấm Chạy ngay (vài phút).", h("code", {}, "npm run scan")))
      : ui.tab === "kept" ? empty("Chưa giữ ý nào", "Bấm Giữ (phím E) ở Hôm nay hoặc Khám phá. Ý đã giữ nằm ở đây cho tới khi bạn đánh dấu Xong.")

/* ---------- detail ---------- */
function spark(series, unit) {
