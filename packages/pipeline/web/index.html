<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--VH_MODE-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<title>VHub Trend Scan</title>
<style>
/* Design tokens. Shared with the Android app (android/app/.../ui/Theme.kt): paper neutrals, one vermilion accent,
   green only for "kept", amber only for "snoozed". Change both places together. */
:root{
  --bg:#f4f3ef;--surface:#fbfaf7;--raised:#fff;--ink:#1c1b18;--ink2:#4a4842;--mute:#77746b;--line:#e2dfd6;--line2:#cfcbc0;
  --accent:#b5461f;--accent-ink:#fff;--accent-soft:#f6e6dd;--pos:#2f6b45;--pos-soft:#e3efe6;--warn:#8a6100;--warn-soft:#f5ecd3;--neg:#a32d23;
  --r:8px;--shadow:0 1px 0 rgba(28,27,24,.04),0 8px 24px -12px rgba(28,27,24,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412;--surface:#1a1a17;--raised:#211f1c;--ink:#ebe8e0;--ink2:#c4c0b5;--mute:#918d82;--line:#2c2b27;--line2:#3c3a34;
  --accent:#e2805a;--accent-ink:#1a0e08;--accent-soft:#3a2419;--pos:#86c39a;--pos-soft:#1c2d22;--warn:#d9b45a;--warn-soft:#352b14;--neg:#ec8f84;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Shell: rail | list | detail on desktop; top bar + list + sheet + tab bar on phones. */
.app{display:grid;grid-template-columns:232px minmax(340px,1fr) minmax(400px,1.25fr);height:100vh;height:100dvh}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:18px;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--ink2)}
.nav button:hover{background:var(--bg)}
.nav button[aria-selected=true]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button[aria-selected=true] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;color:var(--mute)}
.nav kbd{display:none}
.status{margin-top:auto;display:grid;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.status .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--pos)}.dot.bad{background:var(--neg)}.dot.run{background:var(--warn)}
.tok{display:grid;gap:4px}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.meter>i{display:block;height:100%;background:var(--ink2)}
.meter.hot>i{background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:var(--ink2)}
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.keep[aria-pressed=true]{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg);border-color:var(--line)}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.btn.danger:hover{opacity:.9}
dialog.confirm{border:1px solid var(--line2);border-radius:10px;background:var(--raised);color:var(--ink);padding:18px 20px;max-width:min(400px,calc(100vw - 32px))}
dialog.confirm::backdrop{background:rgba(0,0,0,.4)}
dialog.confirm h3{margin:0 0 6px;font-size:15px}
dialog.confirm p{margin:0 0 14px;color:var(--ink2)}
dialog.confirm .row{display:flex;justify-content:space-between;gap:10px}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}

.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.list{border-right:1px solid var(--line)}
.phead{padding:16px 18px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.phead h1{font-size:18px;margin:0;letter-spacing:-.01em}
.phead .sub{font-size:12.5px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--raised)}
.search[hidden]{display:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}

.rows{list-style:none;margin:0;padding:6px 0}
.rowi{display:grid;grid-template-columns:20px 1fr auto;gap:2px 12px;padding:10px 18px;border-left:2px solid transparent;cursor:pointer;align-items:start}
.rowi:hover{background:var(--surface)}
.rowi[aria-selected=true]{background:var(--surface);border-left-color:var(--accent)}
.rowi .t{font-weight:600;font-size:14px;overflow-wrap:anywhere;line-height:1.3}
.rowi .w{grid-column:2/4;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rowi .m{grid-column:2/4;display:flex;gap:10px;font-size:12px;color:var(--mute)}
.rowi .m:empty{display:none}
.rowi .m .st{color:var(--pos);font-weight:600}.rowi .m .st.snoozed{color:var(--warn)}
.rowi .delta{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;padding-top:1px}
.rowi .delta b{color:var(--ink);font-weight:600}
.score{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--mute);margin-top:-1px}
.score.s2{color:var(--ink);border-color:var(--ink2)}
.score.s3{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.detail{background:var(--surface)}
.dbody{padding:22px 26px 28px;display:grid;gap:20px;max-width:720px}
.dtop{display:grid;gap:8px}
.dtop h2{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.dtop .desc{color:var(--ink2);font-size:14.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:600}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 14px;font-size:17px;line-height:1.4;font-weight:500}
.why small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.glance{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2)}
.glance b{color:var(--ink);font-weight:600}
.todo{display:grid;gap:8px}
.todo .one{font-size:15px;color:var(--ink)}
.todo ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.todo li{font-size:14px;color:var(--ink2);padding-left:14px;position:relative}
.todo li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.todo li b{color:var(--ink);font-weight:600}
.more{border-top:1px solid var(--line);padding-top:4px}
.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;color:var(--ink2);font-size:13.5px;font-weight:600}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px;transition:transform .15s}
.more[open]>summary::after{transform:rotate(-135deg)}
.more>div{display:grid;gap:20px;padding:6px 0 4px}
.more .raw{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.cardgrid{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:0}
.cardgrid dt{color:var(--mute);font-size:12.5px;padding-top:1px}
.cardgrid dd{margin:0}
.apply{display:grid;gap:6px}
.apply div b{font-weight:600}
.effort{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.effort i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line2)}
.effort i.on{background:var(--ink2);border-color:var(--ink2)}
.chart{display:grid;gap:6px}
.chart svg{width:100%;height:84px;color:var(--ink2)}
.chart .leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.evi{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.evi li{display:flex;gap:10px;align-items:baseline}
.evi .src{font-family:var(--mono);font-size:11.5px;color:var(--mute);min-width:52px}
.evi a{overflow-wrap:anywhere}
.acts{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:12px 26px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.acts .sp{flex:1}
.back{display:none}

.empty{padding:48px 26px;display:grid;gap:10px;justify-items:start;max-width:460px}
.empty h3{margin:0;font-size:15px}
.empty p{margin:0;color:var(--ink2)}
.empty code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.sk{list-style:none;margin:0;padding:6px 0}
.sk li{padding:12px 18px;display:grid;gap:7px}
.sk i{display:block;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--line) 0,var(--surface) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk i{animation:none}}

/* System view: full width under the list header. */
.sys{padding:18px;display:grid;gap:14px;align-content:start;max-width:980px}
.sys .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.tile small{font-size:12px;color:var(--mute)}
.tile b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tile .meter{margin-top:4px}
.tile.bad b{color:var(--neg)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.panel h3{margin:0;font-size:13px;font-weight:600}
.panel .hint{font-size:12.5px;color:var(--mute)}
.funnel{display:grid;gap:5px}
.funnel div{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
.funnel span{color:var(--ink2)}
.funnel em{font-style:normal;text-align:right}
.funnel i{display:block;height:8px;border-radius:2px;background:var(--ink2);min-width:2px}
.funnel div:last-child i{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
.alert{font-size:12.5px;border-radius:6px;padding:8px 10px;background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}

/* Settings view: full width like System; one panel per group, rows of label + help on the left, control on the right. */
.set{padding:18px 18px 96px;display:grid;gap:14px;align-content:start;max-width:920px}
.set .intro{display:grid;gap:8px}
.set .est{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.set .est b{color:var(--ink);font-weight:600}
.gnav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line2);background:var(--raised);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sgroup{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 8px;scroll-margin-top:48px}
.sgroup>header{padding:12px 0 8px;display:grid;gap:2px}
.sgroup>header h2{margin:0;font-size:15px}
.sgroup>header p{margin:0;font-size:12.5px;color:var(--mute)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:6px 20px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.srow.wide{grid-template-columns:1fr}
.srow .sl{display:grid;gap:3px;min-width:0}
.srow label,.srow .lab{font-weight:600;font-size:13.5px}
.srow .help{margin:0;font-size:12.5px;color:var(--ink2)}
.srow .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--mute)}
.srow .meta button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.srow .meta button[hidden]{display:none}
.srow .meta button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.srow .err{margin:0;font-size:12.5px;color:var(--neg)}
.srow.changed{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px;margin-left:-10px}
.srow.bad label,.srow.bad .lab{color:var(--neg)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:9px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.badge.token{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.field{display:flex;align-items:center;gap:8px;width:100%}
.field input,.field select,.topic input[type=text],.proj input{width:100%;min-width:0;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--raised);color:var(--ink);font:inherit}
.srow textarea,.topic textarea,.proj textarea{height:auto;min-height:64px;padding:7px 10px;resize:vertical;line-height:1.45;width:100%;border:1px solid var(--line2);border-radius:6px;background:var(--raised);color:var(--ink);font:inherit}
.field input:focus,.field select:focus,.srow textarea:focus,.topic input[type=text]:focus,.topic textarea:focus,.proj input:focus,.proj textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field .unit{font-size:12.5px;color:var(--mute);white-space:nowrap}
.ro{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;overflow-wrap:anywhere}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
.switch input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--pos)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topics,.projs{display:grid;gap:10px}
.topic,.proj{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface)}
.topic.off{opacity:.72}
.topic .th,.proj .th{display:flex;align-items:center;gap:10px}
.topic .th input[type=text],.proj .th input{flex:1;font-weight:600}
.topic .sub{font-size:12px;color:var(--mute)}
.topic .tq{display:grid;gap:4px;align-content:start}
.topic .tb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.topic textarea{min-height:36px}
.topic .tq .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.topic .tq small,.proj small{font-size:12px;color:var(--mute)}
.tries{display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
.tries code{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.btn.link{border-color:transparent;background:transparent;color:var(--neg);padding:0 6px}
.btn.link:hover{background:var(--bg)}
.savebar{position:fixed;left:232px;right:0;bottom:0;z-index:8;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line2);box-shadow:0 -8px 24px -16px rgba(0,0,0,.35)}
.savebar[hidden]{display:none}
.savebar .txt{display:grid;gap:1px;font-size:12.5px;color:var(--ink2);min-width:0;flex:1}
.savebar .txt b{color:var(--ink);font-size:13.5px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px}
.hist li small{grid-column:1;color:var(--mute);font-size:12px}
.hist li .btn{grid-row:1/3;grid-column:2}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.rowi .m .cat{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:opacity .15s,transform .15s;z-index:20;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{all:unset;cursor:pointer;color:var(--accent-soft);font-weight:600;padding:4px 8px;border-radius:4px}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent)}}
.keyhelp{padding:0 8px}.keyhelp>summary{cursor:pointer;font-size:12px;color:var(--mute);list-style:none}.keyhelp>summary::-webkit-details-marker{display:none}.keyhelp[open]>summary{margin-bottom:8px}
@media (hover:none){.keyhelp{display:none}}
.keys{font-size:12px;color:var(--mute);padding:0 8px;margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center}
.keys dt{white-space:nowrap}.keys dd{margin:0}
.keys kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink2)}
.tabbar,.topbar{display:none}
.app.is-system .list{grid-column:2/4;border-right:0}
@media (max-width:1180px){.savebar{left:64px}}
.app.is-system .detail{display:none}

/* Medium: rail collapses to icons. */
@media (max-width:1180px){
  .app{grid-template-columns:64px minmax(320px,1fr) minmax(380px,1.2fr)}
  .rail{padding:14px 8px;align-items:center}
  .brand span,.brand b,.nav .label,.nav .count,.status .txt,.status .tok,.keys,.keyhelp{display:none}
  .brand::before{content:"VH";font-weight:700;font-size:13px}
  .nav button{justify-content:center;width:40px;height:36px;padding:0}
  .status{padding:10px 0 0;justify-items:center}
  .status .meter{width:36px}
}
@media (hover:none),(pointer:coarse){.keys{display:none}}

/* Phone and small tablet: list full width, detail as a sheet, tab bar at the bottom. */

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const TABS = [
  { k: "today", t: "Hôm nay", icon: "today" },
  { k: "kept", t: "Đã giữ", icon: "kept" },
  { k: "explore", t: "Khám phá", icon: "explore" },
  { k: "system", t: "Hệ thống", icon: "system" },
  { k: "settings", t: "Cài đặt", icon: "gear" },
];
const WIDE = (tab) => tab === "system" || tab === "settings";
const STATE_LABEL = { new: "Mới", kept: "Đã giữ", skipped: "Đã bỏ", snoozed: "Đang hoãn", trying: "Đang thử", done: "Xong" };
const EFFORT = { S: ["Nhỏ", 1], M: ["Vừa", 2], L: ["Lớn", 3] };
const ui = { tab: "today", items: [], sel: 0, health: null, detail: null, loading: true, error: null, cat: "" };
/* Category id -> label: topics from the settings, plus labels of categories from before topics existed. */
const LEGACY_CATS = { "work-tool": "Công việc", "life-tool": "Đời sống", "dev-tool": "Công cụ lập trình", "ai-agent": "AI agent", automation: "Tự động hoá", other: "Khác" };
const catLabel = (id) => { if (!id) return null; const c = ui.health && ui.health.categories && ui.health.categories.find((x) => x.id === id); return c ? c.label : LEGACY_CATS[id] || id; };
const phone = matchMedia("(max-width: 820px)");

// Two ways to run this page. On the PC (`npm run dashboard`) it talks to the local server with a token. Hosted on
// Firebase Hosting (scripts/build-hosting.mjs sets VH_CLOUD = { p: project, k: API key, u: data folder, c: Google client id })
// it signs in with Google and reads the snapshot the PC published to Firestore.
const CFG = window.VH_CLOUD || null;
const CLOUD = !!CFG;
if (CLOUD) document.documentElement.classList.add("hosted");

// The token arrives once in the URL (printed by `trend serve`), is kept in this browser, and removed from the address bar.
const url = new URL(location.href);
if (!CLOUD && url.searchParams.get("t")) { try { localStorage.setItem("trendToken", url.searchParams.get("t")); } catch {} url.searchParams.delete("t"); history.replaceState(null, "", url.pathname); }
const token = (() => { try { return localStorage.getItem("trendToken") || ""; } catch { return ""; } })();

class AuthError extends Error {}
async function api(path, opt = {}) {
  if (CLOUD) return cloudApi(path, opt);
  const r = await fetch(path, { ...opt, headers: { authorization: "Bearer " + token, "content-type": "application/json" } });
  if (r.status === 401) throw new AuthError("Trình duyệt này chưa có mã truy cập.");
  if (!r.ok && r.status !== 202 && r.status !== 409) throw new Error("Máy chủ trả lỗi " + r.status);
  return r.json();
}

/* ---------- hosted mode: Firebase Auth + Firestore over REST (same contract as the phone app, docs/SYNC.md) ---------- */
const EP = Object.assign({ auth: "https://identitytoolkit.googleapis.com", token: "https://securetoken.googleapis.com", fs: "https://firestore.googleapis.com" }, window.VH_ENDPOINTS || {});
const ACTION_STATE = { keep: "kept", skip: "skipped", snooze: "snoozed", trying: "trying", done: "done", reset: "new" };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const cloud = {
  session: store.get("vhSession"), snap: null, snapAt: 0,
  gsi: null,
  /** Google's sign-in script (Google Identity Services). Tests provide window.google themselves. */
  loadGsi() {
    if (!this.gsi) this.gsi = new Promise((ok, fail) => {
      if (window.google && window.google.accounts) return ok();
      const sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = () => ok(); sc.onerror = () => { this.gsi = null; fail(new Error("Không tải được script đăng nhập của Google. Kiểm tra mạng hoặc trình chặn quảng cáo.")); };
      document.head.append(sc);
    });
    return this.gsi;
  },
  /** Draws Google's button into `el`. Its callback hands us a Google ID token, which Firebase Auth exchanges for a session. */
  async button(el) {
    await this.loadGsi();
    google.accounts.id.initialize({ client_id: CFG.c, callback: (r) => this.signIn(r.credential) });
    google.accounts.id.renderButton(el, { theme: "outline", size: "large", text: "signin_with", shape: "rectangular", locale: "vi", width: 260 });
  },
  async signIn(credential) {
    try {
      const r = await fetch(`${EP.auth}/v1/accounts:signInWithIdp?key=${encodeURIComponent(CFG.k)}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ postBody: "id_token=" + encodeURIComponent(credential) + "&providerId=google.com", requestUri: location.origin, returnSecureToken: true, returnIdpCredential: true }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error("Firebase từ chối đăng nhập (" + ((j.error && j.error.message) || r.status) + "). Đã bật Google trong Firebase Authentication chưa?");
      this.session = { email: j.email, refresh: j.refreshToken, id: j.idToken, until: Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 60000 };
      store.set("vhSession", this.session);
      this.snap = null;
      ui.error = null;
    } catch (e) { ui.error = e; }
    load();
  },
  /** Forgets the sign-in on this browser (the Google account itself stays signed in elsewhere). */
  signOut() {
    this.session = null; this.snap = null; store.set("vhSession", null); store.set("vhOverlay", null);
    try { google.accounts.id.disableAutoSelect(); } catch {}
    ui.items = []; ui.health = null; ui.error = new AuthError("Đã đăng xuất.");
    renderNav(); renderStatus(); renderList();
  },
  lost(msg) { const e = this.session && this.session.email; this.session = null; store.set("vhSession", null); return new AuthError(msg.replace("{email}", e || "này")); },
  async idToken() {
    const s = this.session;
    if (!s) throw new AuthError("Đăng nhập bằng Google để xem.");
    if (s.id && Date.now() < s.until) return s.id;
    const r = await fetch(`${EP.token}/v1/token?key=${encodeURIComponent(CFG.k)}`, { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(s.refresh) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw this.lost("Phiên đăng nhập đã hết hạn. Đăng nhập lại.");
    this.session = { ...s, refresh: j.refresh_token || s.refresh, id: j.id_token, until: Date.now() + (Number(j.expires_in) || 3600) * 1000 - 60000 };
    store.set("vhSession", this.session);
    return this.session.id;
  },
  docs() { return `${EP.fs}/v1/projects/${CFG.p}/databases/(default)/documents/owners/${CFG.u}`; },
  async fetchSnapshot() {
    const idt = await this.idToken();
    const r = await fetch(this.docs() + "/snapshot/latest", { headers: { authorization: "Bearer " + idt } });
    if (r.status === 404) throw new Error("PC chưa đẩy dữ liệu lên cloud. Trên PC chạy: npm run sync");
    if (r.status === 401 || r.status === 403) throw this.lost("Tài khoản {email} không nằm trong danh sách được phép. Thêm địa chỉ vào allowed_emails (infra/terraform.tfvars), chạy terraform apply, hoặc đăng nhập tài khoản khác.");
    if (!r.ok) throw new Error("Cloud trả lỗi " + r.status);
    const j = await r.json();
    const payload = j.fields && j.fields.payload && j.fields.payload.stringValue;
    if (!payload) throw new Error("Snapshot trên cloud không đọc được.");
    return JSON.parse(payload);
  },
  /** Re-reads at most every 30 s; actions patch the view locally (overlay) until the PC has applied them. */
  async snapshot(force) {
    if (force || !this.snap || Date.now() - this.snapAt > 30000) { this.snap = await this.fetchSnapshot(); this.snapAt = Date.now(); }
    return this.snap;
  },
  overlay() {
    const gen = this.snap ? Date.parse(this.snap.generatedAt) || 0 : 0;
    const all = store.get("vhOverlay") || [];
    const live = all.filter((o) => o.at > gen);
    if (live.length !== all.length) store.set("vhOverlay", live);
    return new Map(live.map((o) => [o.id, o]));
  },
  /** The snapshot with the user's not-yet-synced actions applied. */
  view() {
    const s = this.snap, ov = this.overlay();
    const patch = (it) => (ov.has(it.id) ? { ...it, userState: ov.get(it.id).state } : it);
    const digest = s.digest.map(patch);
    const known = new Map([...s.digest, ...s.kept, ...s.explore].map((it) => [it.id, patch(it)]));
    const kept = [...known.values()].filter((it) => it.userState === "kept" || it.userState === "trying").sort((x, y) => (y.userState === "trying") - (x.userState === "trying"));
    const explore = [...known.values()].filter((it) => it.userState === "new").sort((x, y) => (y.triage.score ?? -1) - (x.triage.score ?? -1) || (y.stars ?? y.points ?? 0) - (x.stars ?? x.points ?? 0));
    return { s, digest, kept, explore, known };
  },
  async send(id, action, days) {
    const idt = await this.idToken();
    const eventId = crypto.randomUUID();
    const at = Date.now();
    const fields = { entityId: { stringValue: id }, action: { stringValue: action }, at: { integerValue: String(at) }, device: { stringValue: "web" } };
    if (action === "snooze") fields.days = { integerValue: String(days || 7) };
    const r = await fetch(`${this.docs()}/inbox?documentId=${eventId}`, { method: "POST", headers: { authorization: "Bearer " + idt, "content-type": "application/json" }, body: JSON.stringify({ fields }) });
    if (!r.ok && r.status !== 409) throw new Error("Cloud trả lỗi " + r.status);
    store.set("vhOverlay", [...(store.get("vhOverlay") || []).filter((o) => o.id !== id), { id, state: ACTION_STATE[action] || "new", at }]);
    return { ok: true };
  },
  /** A settings change: only the edited settings, as JSON. The PC validates and applies it on its next sync (docs/SYNC.md). */
  async sendSettings(patch, baseRev) {
    const idt = await this.idToken();
    const id = "set" + crypto.randomUUID().replace(/-/g, "");
    const at = Date.now();
    const fields = { patch: { stringValue: JSON.stringify(patch) }, baseRev: { stringValue: baseRev || "" }, at: { integerValue: String(at) }, device: { stringValue: "web" } };
    const r = await fetch(`${this.docs()}/settingsInbox?documentId=${id}`, { method: "POST", headers: { authorization: "Bearer " + idt, "content-type": "application/json" }, body: JSON.stringify({ fields }) });
    if (!r.ok && r.status !== 409) throw new Error(r.status === 403 ? "Cloud từ chối thay đổi này (quá lớn hoặc sai định dạng)." : "Cloud trả lỗi " + r.status);
    store.set("vhSettingsPending", { id, at, patch });
    return { ok: true, pending: true };
  },
  /** The settings form from the snapshot, with a change that the PC has not applied yet shown on top. */
  settingsPage() {
    const st = this.snap.settings;
    if (!st) throw new Error("PC chưa gửi cài đặt lên cloud. Cập nhật pipeline trên PC rồi chạy: npm run sync");
    let pending = store.get("vhSettingsPending");
    if (pending && st.remote && st.remote.id === pending.id) { store.set("vhSettingsPending", null); pending = null; }
    const values = pending ? { ...st.values, ...pending.patch } : st.values;
    return { ...st, values, pending, history: [], canTestQuery: false, cloud: true };
  },
};
async function cloudApi(path, opt) {
  if (!cloud.session) throw new AuthError("Đăng nhập bằng Google để xem.");
  const u = new URL(path, "http://x");
  if (opt.method === "POST") {
    if (u.pathname === "/api/feedback") { const b = JSON.parse(opt.body); await cloud.snapshot(); return cloud.send(b.id, b.action, b.days); }
    if (u.pathname === "/api/settings") { const b = JSON.parse(opt.body); await cloud.snapshot(); return cloud.sendSettings(b.patch, b.baseRev); }
    if (u.pathname.startsWith("/api/settings/")) throw new Error("Chỉ làm được trên dashboard của PC.");
    return { started: false, reason: "chạy quét trên PC" };
  }
  await cloud.snapshot(u.pathname === "/api/settings");
  const v = cloud.view(), q = (u.searchParams.get("q") || "").trim().toLowerCase();
  if (u.pathname === "/api/settings") return cloud.settingsPage();
  if (u.pathname === "/api/health") {
    const h = v.s.health, lr = h.lastRun;
    return { lastRun: lr && { started_at: lr.startedAt, finished_at: lr.finishedAt, status: lr.status, error: lr.error, stats: lr }, tokens: { inTokens: h.tokens.used, outTokens: 0, limit: h.tokens.limit, calls: h.tokens.calls, costUsd: h.tokens.costUsd }, userStates: h.counts, digestCount: v.digest.length, categories: v.s.settings ? v.s.settings.categories : null, cloud: { projectId: CFG.p, syncMinutes: null, last: { at: v.s.generatedAt, ok: true, applied: 0 } } };
  }
  if (u.pathname === "/api/digest") return { day: v.s.day, items: v.digest };
  if (u.pathname === "/api/entities") {
    const st = u.searchParams.get("state"), lim = Number(u.searchParams.get("limit")) || 50;
    let items = st === "kept" ? v.kept.filter((x) => x.userState === "kept") : st === "trying" ? v.kept.filter((x) => x.userState === "trying") : [...v.known.values()].filter((x) => x.userState !== "skipped" && x.userState !== "done");
    if (q) items = items.filter((x) => (x.title + " " + (x.description || "") + " " + (x.topics || []).join(" ")).toLowerCase().includes(q));
    else if (!st) items = v.explore;
    const cat = u.searchParams.get("cat");
    if (cat) items = items.filter((x) => x.triage.cat === cat);
    return { items: items.slice(0, lim) };
  }
  if (u.pathname === "/api/entity") {
    const it = v.known.get(u.searchParams.get("id"));
    if (!it) throw new Error("Không thấy mục này trong snapshot.");
    return { ...it, observations: (it.series || []).map((n) => ({ stars: n })), sightings: (it.sources || []).map((src) => ({ source: src, url: "" })) };
  }
  throw new Error("Không hỗ trợ " + u.pathname);
}

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);

/* ---------- settings ---------- */
// One form for the PC (reads and writes config.json through /api/settings) and the hosted page (reads the snapshot,
// sends the change to the PC through the cloud). The catalogue (labels, help, limits) comes from the PC, so the
// page never has its own copy of what a setting means.
const S = { page: null, draft: {}, errors: {}, preview: null, saving: false, tries: {}, problem: null };
const SOURCE_LABEL = { pc: "PC", phone: "điện thoại", web: "web", restore: "khôi phục" };

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function dirtyCount() { return Object.keys(S.draft).length; }
const valueOf = (key) => (key in S.draft ? S.draft[key] : S.page.values[key]);
const defOf = (key) => S.page.defs.find((d) => d.key === key);
/** Read-only here: only config.json may change it, or only the PC page may (on the hosted page). */

async function loadSettings() {
  try { S.page = await api("/api/settings"); S.problem = null; }
  catch (e) { if (e instanceof AuthError) throw e; S.problem = e.message; }
}

function setValue(key, v) {
  if (same(v, S.page.values[key])) delete S.draft[key]; else S.draft[key] = v;
  const def = defOf(key);
  const p = checkValue(def, v);
  if (p) S.errors[key] = p; else delete S.errors[key];
  markRow(key); renderSavebar(); schedulePreview();
}
function markRow(key) {
  const row = document.getElementById("s-" + key.replace(/\./g, "-")); if (!row) return;
  row.classList.toggle("changed", key in S.draft);
  row.classList.toggle("bad", !!S.errors[key]);
  const err = row.querySelector(".err"); if (err) { err.textContent = S.errors[key] || ""; err.hidden = !S.errors[key]; }
  const reset = row.querySelector("[data-reset]"); if (reset) reset.hidden = same(valueOf(key), S.page.defaults[key]);

/** Same limits the PC enforces (it checks again; this only gives feedback while typing). */
function checkValue(d, v) {
  if (d.type === "int" || d.type === "number") {
    if (typeof v !== "number" || !Number.isFinite(v)) return "phải là số";
    if (d.type === "int" && !Number.isInteger(v)) return "phải là số nguyên";
    if (d.min != null && v < d.min) return "nhỏ nhất là " + d.min;
    if (d.max != null && v > d.max) return "lớn nhất là " + d.max;
  }
  if (d.type === "text" && !String(v).trim()) return "không được để trống";
  if (d.type === "topics") {
    const ids = new Set();
    for (const [i, t] of v.entries()) {
      if (!t.label.trim()) return `chủ đề ${i + 1}: cần tên`;
      if (ids.has(t.id)) return `chủ đề "${t.label}": trùng mã với chủ đề khác, đổi tên khác`;
      ids.add(t.id);
    }
  }
  if (d.type === "projects") for (const [i, p] of v.entries()) if (!p.name.trim() || !p.summary.trim()) return `dự án ${i + 1}: cần tên và mô tả`;
  return null;
}
function slug(label) {
  return label.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32).replace(/-+$/, "") || "chu-de";

const lines = (txt) => txt.split("\n").map((x) => x.trim()).filter(Boolean);
const commas = (txt) => txt.split(",").map((x) => x.trim()).filter(Boolean);

function schedulePreview() {
  clearTimeout(schedulePreview.t);
  if (CLOUD || !dirtyCount() || Object.keys(S.errors).length) { S.preview = null; renderSavebar(); return; }
  schedulePreview.t = setTimeout(async () => {
    try {
      const r = await fetch("/api/settings/preview", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify({ patch: S.draft }) });
      const j = await r.json();
      S.preview = r.ok ? j : null;
      if (!r.ok && j.errors) for (const e of j.errors) { S.errors[e.key] = e.problem; markRow(e.key); }
    } catch { S.preview = null; }

function renderSavebar() {
  const bar = $("#savebar"); const n = ui.tab === "settings" && S.page ? dirtyCount() : 0;

  const bad = Object.keys(S.errors).length;
  const p = S.preview;
  const detail = bad ? `${bad} mục chưa hợp lệ, sửa chỗ tô đỏ rồi lưu.`

    : p ? [`Ước tính mỗi lần quét: ${fmtK(p.before.tokens)} → ${fmtK(p.after.tokens)} token`, p.recheck.dropped || p.recheck.revived ? ` · lần quét sau loại thêm ${p.recheck.dropped} ý, đưa lại ${p.recheck.revived} ý đã thấy` : ""].join("")

  bar.replaceChildren(

    h("button", { class: "btn primary", id: "save", disabled: bad > 0 || S.saving, onclick: saveSettings }, S.saving ? "Đang lưu…" : CLOUD ? "Gửi về PC" : "Lưu"));

async function saveSettings() {

      S.draft = {}; S.errors = {};
      await loadSettings();
      toast("Đã gửi. PC áp dụng ở lần đồng bộ kế tiếp.");
    } else {
      const r = await fetch("/api/settings", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify({ patch: S.draft, baseRev: S.page.rev }) });
      if (r.status === 401) throw new AuthError("Trình duyệt này chưa có mã truy cập.");
      const j = await r.json();
      if (r.status === 409) { S.problem = null; toast("Cài đặt vừa được đổi ở nơi khác. Đã tải bản mới; thay đổi của bạn vẫn còn, kiểm tra rồi lưu lại."); S.page = j.view; for (const k of Object.keys(S.draft)) if (same(S.draft[k], S.page.values[k])) delete S.draft[k]; }
      else if (!r.ok) { for (const e of j.errors || []) S.errors[e.key || "_"] = e.problem; toast("Chưa lưu: " + (j.errors || []).map((e) => (defOf(e.key) ? defOf(e.key).label + ": " : "") + e.problem).join("; ")); }
      else {
        S.page = j.view; S.draft = {}; S.errors = {}; S.preview = null;
        const id = j.entry && j.entry.id;
        toast(j.changed.length ? `Đã lưu ${j.changed.length} cài đặt. Áp dụng từ lần quét sau.` : "Không có gì thay đổi.", id ? () => restoreSettings(id, true) : null);
      }
    }
  } catch (e) { if (e instanceof AuthError) { ui.error = e; } toast("Chưa lưu được: " + e.message); }
  S.saving = false;
  ui.health && (ui.health.categories = S.page && S.page.categories);
  renderList();
}

async function restoreSettings(id, quiet) {
  if (!quiet && !(await confirmDialog("Trả cài đặt về trước lần đổi này?", "Mọi cài đặt sẽ về như ngay trước lần đổi đó. Việc khôi phục cũng được ghi vào nhật ký nên có thể hoàn tác.", "Khôi phục"))) return;
  try {
    const r = await fetch("/api/settings/restore", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify({ id }) });
    const j = await r.json();
    if (!r.ok) throw new Error((j.errors || []).map((e) => e.problem).join("; ") || "lỗi " + r.status);
    S.page = j.view; S.draft = {}; S.errors = {};
    toast("Đã khôi phục cài đặt.");
  } catch (e) { toast("Chưa khôi phục được: " + e.message); }
  renderList();
}

async function tryQueries(topicIdx, queries) {
  S.tries[topicIdx] = queries.map((q) => ({ q, text: "đang hỏi GitHub…" }));
  rerenderTopics();
  for (const [i, q] of queries.entries()) {
    try {
      const r = await fetch("/api/settings/test-query", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify({ query: q }) });
      const j = await r.json();
      S.tries[topicIdx][i].text = r.ok ? `${fmt.format(j.total)} repo khớp. Nhiều sao nhất: ${j.items.slice(0, 3).map((x) => `${x.name} (${compact.format(x.stars)} sao)`).join(", ") || "không có"}` : "Lỗi: " + (j.error || r.status);
    } catch (e) { S.tries[topicIdx][i].text = "Lỗi: " + e.message; }

        d.applies === "restart" ? h("span", {}, "Cần mở lại dashboard") : null,
        !locked ? h("button", { "data-reset": d.key, hidden: same(valueOf(d.key), S.page.defaults[d.key]), onclick: () => { setValue(d.key, structuredClone(S.page.defaults[d.key])); renderList(); } }, "Về mặc định") : null),
      h("p", { class: "err", hidden: !S.errors[d.key] }, S.errors[d.key] || "")),
    control(d));
  return row;
}
function renderSettings(v) {
  if (S.problem || !S.page) {
    $("#psub").textContent = "";
    return v.replaceChildren(empty("Không tải được cài đặt", S.problem || "Đang tải…", h("button", { class: "btn", onclick: () => load() }, "Thử lại")));
  }
  const pg = S.page; const est = pg.estimate;
  $("#psub").textContent = CLOUD ? "Sửa ở đây; PC kiểm tra và áp dụng ở lần đồng bộ kế tiếp" : "Lưu vào " + pg.file;
  const remote = pg.remote;
  const notes = [];
  if (CLOUD && pg.pending) notes.push(h("div", { class: "alert", id: "settings-pending" }, `Đang chờ PC áp dụng thay đổi gửi lúc ${new Date(pg.pending.at).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })} (${Object.keys(pg.pending.patch).map((k) => (defOf(k) || { label: k }).label).join(", ")}). PC cần đang bật dashboard hoặc chạy quét.`));
  else if (remote && Date.now() - remote.sentAt < 7 * 86400000) notes.push(remote.ok
    ? h("div", { class: "alert", id: "settings-remote", style: "background:var(--pos-soft);color:var(--pos)" }, `PC đã áp dụng thay đổi từ ${remote.device === "web" ? "web" : remote.device || "điện thoại"} ${ago(remote.appliedAt)}: ${remote.changed.map((k) => (defOf(k) || { label: k }).label).join(", ") || "không có gì khác"}.`)
    : h("div", { class: "alert bad", id: "settings-remote" }, `PC từ chối thay đổi từ ${remote.device || "điện thoại"} ${ago(remote.appliedAt)}: ${remote.errors.map((e) => ((defOf(e.key) || {}).label || e.key || "") + " " + e.problem).join("; ")}`));
  const groups = pg.groups.map((g) => {
    const defs = pg.defs.filter((d) => d.group === g.id);
    const basic = defs.filter((d) => !d.advanced), adv = defs.filter((d) => d.advanced);
    const openAdv = adv.some((d) => d.key in S.draft || S.errors[d.key]);
    return h("section", { class: "sgroup", id: "g-" + g.id, "aria-labelledby": "gh-" + g.id },
      h("header", {}, h("h2", { id: "gh-" + g.id }, g.label), h("p", {}, g.help)),
      basic.map(settingRow),
      adv.length ? h("details", { class: "more", open: openAdv || null }, h("summary", {}, `Nâng cao (${adv.length})`), h("div", { style: "display:block;padding:0" }, adv.map(settingRow))) : null);
  });
  const hist = !CLOUD && pg.history.length ? h("section", { class: "sgroup", id: "g-history" },
    h("header", {}, h("h2", {}, "Nhật ký thay đổi"), h("p", {}, "Mỗi lần lưu giữ lại bản trước đó. Khôi phục đưa mọi cài đặt về như ngay trước lần đổi.")),
    h("ul", { class: "hist", style: "padding:4px 0 10px" }, pg.history.slice(0, 10).map((e) => h("li", {},
      h("span", {}, e.changed.map((k) => (defOf(k) || { label: k }).label).join(", ")),
      h("small", {}, `${ago(e.at)} · từ ${SOURCE_LABEL[e.source] || e.source}${e.device ? " (" + e.device + ")" : ""}`),
      h("button", { class: "btn sm", onclick: () => restoreSettings(e.id) }, "Khôi phục"))))) : null;
  const nav = h("nav", { class: "gnav", "aria-label": "Nhóm cài đặt" }, pg.groups.map((g) => h("button", { class: "chip", onclick: () => document.getElementById("g-" + g.id).scrollIntoView({ behavior: "smooth", block: "start" }) }, g.label)));
  v.replaceChildren(h("div", { class: "set" },
    h("div", { class: "intro" },
      h("div", { class: "est num", id: "estimate" },
        h("span", {}, "Mỗi lần quét: ", h("b", {}, fmt.format(est.searches)), " lượt tìm GitHub"),
        h("span", {}, "tối đa ", h("b", {}, fmt.format(est.triageCalls + est.cardCalls)), " lần gọi AI"),
        h("span", {}, h("b", {}, fmtK(est.tokens)), " token (ước tính, chưa trừ cache)")),
      ...notes),
    nav, ...groups, hist));
  renderSavebar();
}

/* ---------- category filter (Explore) ---------- */
function renderCats() {
  const box = $("#cats");
  const cats = ((ui.health && ui.health.categories) || []).filter((c) => c.active);
  box.hidden = ui.tab !== "explore" || cats.length < 2;
  if (box.hidden) return box.replaceChildren();
  const pick = (id) => { ui.cat = ui.cat === id ? "" : id; ui.sel = 0; load(); };
  box.replaceChildren(h("button", { class: "chip", "aria-pressed": String(!ui.cat), onclick: () => pick("") }, "Tất cả"),
    ...cats.map((c) => h("button", { class: "chip", "aria-pressed": String(ui.cat === c.id), onclick: () => pick(c.id) }, c.label)));
}

/* ---------- data ---------- */
async function load(o = {}) {
  const prevId = ui.items[ui.sel] && ui.items[ui.sel].id; const prevSel = ui.sel;
  ui.loading = true; ui.error = null;
  if (!o.keepIndex) renderList();
  try {
    const hl = await api("/api/health");
    let items = [], day = null;
    if (ui.tab === "today") { const d = await api("/api/digest"); items = d.items; day = d.day; hl.digestCount = items.length; }
    else if (ui.tab === "kept") { const [a, b] = await Promise.all([api("/api/entities?state=kept&limit=200"), api("/api/entities?state=trying&limit=200")]); items = [...b.items, ...a.items]; }
    else if (ui.tab === "explore") { items = (await api("/api/entities?limit=80&q=" + encodeURIComponent($("#q").value) + (ui.cat ? "&cat=" + encodeURIComponent(ui.cat) : ""))).items; }
    else if (ui.tab === "settings" && !o.keepSettings) { await loadSettings(); }
    if (hl.digestCount == null && ui.health) hl.digestCount = ui.health.digestCount;
    ui.health = hl; ui.items = items; ui.day = day;
    const keep = items.findIndex((x) => x.id === prevId);
    ui.sel = keep >= 0 ? keep : Math.min(o.keepIndex ? prevSel : 0, Math.max(0, items.length - 1));
  } catch (e) { ui.error = e; }
  ui.loading = false;
  renderNav(); renderStatus(); renderList();
}

$("#q").addEventListener("input", () => { clearTimeout(load.t); load.t = setTimeout(() => load(), 220); });
$("#closesheet").addEventListener("click", () => closeSheet());
$("#runnow2").addEventListener("click", runNow);
document.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.target.closest("input, textarea, select")) { if (ev.key === "Escape") ev.target.blur(); return; }
  const k = ev.key.toLowerCase(); const it = ui.items[ui.sel];
  if (/^[1-5]$/.test(k)) return go(TABS[Number(k) - 1].k);
  if (k === "/") { ev.preventDefault(); if (ui.tab !== "explore") go("explore"); setTimeout(() => $("#q").focus(), 0); return; }
  if (k === "escape") return closeSheet();
  if (WIDE(ui.tab) || !ui.items.length) return;
  if (k === "j" || k === "arrowdown") { ev.preventDefault(); select(ui.sel + 1); }
  else if (k === "k" || k === "arrowup") { ev.preventDefault(); select(ui.sel - 1); }
  else if (k === "enter") select(ui.sel, true);
  else if (k === "o" && safeHref(it.url)) window.open(it.url, "_blank", "noopener");
  else if (k === "e") act(it, ui.tab === "kept" ? "trying" : "keep", ui.tab === "kept" ? "Đã chuyển sang Đang thử" : "Đã giữ");
  else if (k === "x") act(it, "skip", "Đã bỏ");
  else if (k === "s" && ui.tab !== "kept") act(it, "snooze", "Sẽ hiện lại sau 7 ngày");
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) load({ keepIndex: true, keepSettings: true }); });
addEventListener("beforeunload", (ev) => { if (dirtyCount()) { ev.preventDefault(); ev.returnValue = ""; } });
renderNav();
load();
</script>
</body>
