<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>VHub Trend Scan</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#13202b;--mute:#556573;--line:#d5dde3;--accent:#0b7a86;--accent-soft:#dcefF1;--ok:#1c7c47;--ok-soft:#ddf1e5;--warn:#9a5b00;--bad:#b02a1e}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--card:#16212b;--ink:#e5ecf1;--mute:#93a4b2;--line:#2a3a47;--accent:#4fc3ce;--accent-soft:#143a40;--ok:#5fd08c;--ok-soft:#173a26;--warn:#f0b352;--bad:#ff8b7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
main{max-width:820px;margin:0 auto;display:grid;gap:12px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.keep{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card h2{font-size:16px;margin:0;overflow-wrap:anywhere}
.card h2 a{color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.why{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13.5px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
dt{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}dd{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--mute);font-size:13px}
input[type=search]{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:min(560px,92vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:9}
#toast button{background:transparent;color:inherit;border-color:currentColor;padding:2px 8px}
</style>
</head>
<body>
<main>
  <header>
    <h1>VHub Trend Scan</h1>
    <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="runpill" class="pill">…</span><button id="runnow">Chạy ngay</button></span>
  </header>
  <nav id="tabs" role="tablist" aria-label="Màn hình"></nav>
  <input id="q" type="search" placeholder="Tìm trong ý tưởng đã phân tích" aria-label="Tìm kiếm" hidden>
  <section id="view" aria-live="polite"></section>
  <p class="muted" id="keys">Phím tắt: J/K chọn, E giữ, X bỏ, S hoãn, Enter chi tiết.</p>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const TABS = [["today", "Hôm nay"], ["kept", "Đã giữ"], ["explore", "Khám phá"], ["system", "Hệ thống"]];
let tab = "today", items = [], sel = 0, undo = null;

// The token comes in the URL once (printed by `trend serve`), is kept in this browser, and removed from the address bar.
const url = new URL(location.href);
if (url.searchParams.get("t")) { try { localStorage.setItem("trendToken", url.searchParams.get("t")); } catch {} url.searchParams.delete("t"); history.replaceState(null, "", url.pathname); }
const token = (() => { try { return localStorage.getItem("trendToken") || ""; } catch { return ""; } })();

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { authorization: "Bearer " + token, "content-type": "application/json" } });
  if (r.status === 401) throw new Error("Chưa có mã truy cập. Mở lại địa chỉ do `trend serve` in ra (có ?t=...).");
  if (!r.ok && r.status !== 202 && r.status !== 409) throw new Error("Lỗi " + r.status);
  return r.json();
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const safeHref = (u) => (/^https?:\/\//i.test(u) ? u : null);
const when = (iso) => { if (!iso) return "—"; const d = new Date(iso); return d.toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }); };

function toast(text, undoFn) {
  const t = $("#toast"); t.replaceChildren(text);
  if (undoFn) t.append(h("button", { onclick: () => { undoFn(); t.style.display = "none"; } }, "Hoàn tác"));
  t.style.display = "flex"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 7000);
}
async function act(it, action, label, days) {
  const prev = it.userState;
  await api("/api/feedback", { method: "POST", body: JSON.stringify({ id: it.id, action, days }) });
  const back = { new: "reset", kept: "keep", skipped: "skip", snoozed: "snooze", trying: "trying", done: "done" }[prev] || "reset";
  toast(label, async () => { await api("/api/feedback", { method: "POST", body: JSON.stringify({ id: it.id, action: back }) }); load(); });
  load();
}

function card(it, i) {
  const c = it.card;
  const metric = it.stars != null ? "★ " + it.stars : it.points != null ? "▲ " + it.points : null;
  const href = safeHref(it.url);
  const actions = tab === "kept"
    ? [["Đang thử", "trying", "Đã chuyển sang Đang thử"], ["Xong", "done", "Đã đánh dấu xong"], ["Bỏ", "skip", "Đã bỏ"]]
    : [["Giữ", "keep", "Đã giữ", "keep"], ["Bỏ", "skip", "Đã bỏ"], ["Hoãn 7 ngày", "snooze", "Sẽ hiện lại sau 7 ngày"]];
  return h("article", { class: "card" + (i === sel ? " sel" : ""), "data-i": i, tabindex: "-1" },
    h("h2", {}, href ? h("a", { href, target: "_blank", rel: "noopener noreferrer" }, it.title) : it.title),
    h("div", { class: "chips" }, it.sources.map((s) => h("span", { class: "chip" }, s)), metric && h("span", { class: "chip" }, metric), it.triage.cat && h("span", { class: "chip" }, it.triage.cat), it.userState !== "new" && h("span", { class: "chip" }, it.userState)),
    h("div", { class: "muted" }, it.description),
    it.triage.why && h("div", { class: "why" }, it.triage.why),
    c && h("dl", {}, h("dt", {}, "Là gì"), h("dd", {}, c.what), h("dt", {}, "Đáng học"), h("dd", {}, c.learn),
      c.apply.length ? [h("dt", {}, "Áp dụng"), h("dd", {}, c.apply.map((a) => h("div", {}, a.project + ": " + a.how)))] : null,
      h("dt", {}, "Nỗ lực"), h("dd", {}, c.effort), h("dt", {}, "Lưu ý"), h("dd", {}, c.risk)),
    h("div", { class: "acts" }, actions.map(([t, a, m, cls]) => h("button", { class: cls || "", onclick: () => act(it, a, m) }, t)), h("button", { onclick: () => detail(it) }, "Chi tiết")));
}

function spark(obs) {
  const v = obs.map((o) => o.stars ?? o.points ?? 0);
  if (v.length < 2) return h("div", { class: "muted" }, "Chưa đủ dữ liệu để vẽ biểu đồ (cần ít nhất 2 ngày).");
  const w = 300, ht = 60, max = Math.max(...v, 1), min = Math.min(...v);
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * (w - 8) + 4},${ht - 6 - ((y - min) / Math.max(1, max - min)) * (ht - 12)}`).join(" ");
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${ht}`); s.setAttribute("width", "100%"); s.setAttribute("role", "img"); s.setAttribute("aria-label", "Số liệu theo ngày");
  const p = document.createElementNS(s.namespaceURI, "polyline"); p.setAttribute("points", pts); p.setAttribute("fill", "none"); p.setAttribute("stroke", "currentColor"); p.setAttribute("stroke-width", "2.4"); s.append(p);
  return s;
}
async function detail(it) {
  const d = await api("/api/entity?id=" + encodeURIComponent(it.id));
  const dlg = $("#dlg");
  dlg.replaceChildren(h("h2", {}, d.title), spark(d.observations),
    h("div", { class: "muted" }, "Thấy lần đầu " + when(d.firstSeen) + (d.license ? " · giấy phép " + d.license : "")),
    h("h3", {}, "Bằng chứng"), h("ul", {}, d.sightings.map((s) => h("li", {}, s.source + ": ", safeHref(s.url) ? h("a", { href: s.url, target: "_blank", rel: "noopener noreferrer" }, s.url) : s.url))),
    h("div", { class: "acts" }, h("button", { onclick: () => dlg.close() }, "Đóng")));
  dlg.showModal();
}

async function render() {
  const v = $("#view"); $("#q").hidden = tab !== "explore";
  if (tab === "system") {
    const s = await api("/api/health"); const r = s.lastRun, st = r ? r.stats : {};
    const pct = Math.min(100, Math.round(((s.tokens.inTokens + s.tokens.outTokens) / s.tokens.limit) * 100));
    v.replaceChildren(h("div", { class: "card" },
      h("h2", {}, "Lần chạy gần nhất"),
      r ? h("div", {}, `${when(r.started_at)} · ${r.status}${r.error ? " · " + r.error : ""}`) : h("div", { class: "muted" }, "Chưa có lần chạy nào. Chạy `trend run` hoặc bấm Chạy ngay."),
      r && h("table", {}, [["Thu thập", st.collected], ["Thực thể mới", st.created], ["Gộp trùng", st.merged], ["Phân loại (AI)", st.triaged], ["Thẻ chi tiết", st.carded], ["Vào digest", st.digest], ["Gọi AI / dùng lại cache", `${st.llmCalls} / ${st.cacheHits}`]].map(([k, val]) => h("tr", {}, h("th", {}, k), h("td", {}, String(val ?? "—"))))),
      r && Object.keys(st.dropped || {}).length ? h("div", { class: "muted" }, "Loại bởi luật: " + Object.entries(st.dropped).map(([k, n]) => k + " " + n).join(", ")) : null,
      st.degraded && st.degraded.length ? h("div", { class: "pill bad" }, "Chế độ hạ cấp: " + st.degraded.join(", ")) : null,
      st.sourceErrors && st.sourceErrors.length ? h("div", { class: "pill bad" }, "Lỗi nguồn: " + st.sourceErrors.join("; ")) : null),
      h("div", { class: "card" }, h("h2", {}, "Token hôm nay"), h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })),
        h("div", { class: "muted" }, `${s.tokens.inTokens + s.tokens.outTokens} / ${s.tokens.limit} (${s.tokens.calls} lần gọi, $${s.tokens.costUsd.toFixed(4)})`)));
    return;
  }
  const path = tab === "today" ? "/api/digest" : tab === "kept" ? "/api/entities?state=kept&limit=100" : "/api/entities?limit=60&q=" + encodeURIComponent($("#q").value);
  let data = await api(path); items = data.items || [];
  if (tab === "kept") items = items.concat((await api("/api/entities?state=trying&limit=100")).items);
  sel = Math.min(sel, Math.max(0, items.length - 1));
  v.replaceChildren(...(items.length ? items.map(card) : [h("div", { class: "card muted" }, tab === "today" ? "Hôm nay chưa có ý nào đáng xem. Không có push vì không có gì để báo." : "Chưa có mục nào.")]));
  if (tab === "today" && data.day) v.prepend(h("div", { class: "muted" }, "Digest ngày " + data.day + " · " + items.length + " ý"));
}
async function load() {
  try {
    const hl = await api("/api/health"); const r = hl.lastRun;
    const p = $("#runpill"); p.textContent = r ? `${r.status} · ${when(r.started_at)}` : "chưa chạy"; p.className = "pill " + (r && r.status === "ok" ? "ok" : r && r.status === "failed" ? "bad" : "");
    await render();
  } catch (e) { $("#view").replaceChildren(h("div", { class: "card" }, String(e.message))); }
}
$("#tabs").replaceChildren(...TABS.map(([k, t]) => h("button", { role: "tab", "data-k": k, class: k === tab ? "on" : "", onclick: () => { tab = k; sel = 0; document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.k === k)); load(); } }, t)));
$("#q").addEventListener("input", () => { clearTimeout(render.t); render.t = setTimeout(load, 250); });
$("#runnow").addEventListener("click", async () => { const r = await api("/api/run", { method: "POST", body: "{}" }); toast(r.started ? "Đã bắt đầu chạy. Tải lại sau ít phút." : "Chưa chạy được: " + (r.reason || "đang có lần chạy khác")); });
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest("input,dialog") || ev.ctrlKey || ev.metaKey || ev.altKey || !items.length) return;
  const k = ev.key.toLowerCase(), it = items[sel];
  if (k === "j") sel = Math.min(items.length - 1, sel + 1); else if (k === "k") sel = Math.max(0, sel - 1);
  else if (k === "e") return act(it, "keep", "Đã giữ"); else if (k === "x") return act(it, "skip", "Đã bỏ"); else if (k === "s") return act(it, "snooze", "Sẽ hiện lại sau 7 ngày"); else if (k === "enter") return detail(it); else return;
  document.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("sel", i === sel));
  const el = document.querySelector(`.card[data-i="${sel}"]`); el && el.scrollIntoView({ block: "nearest" });
});
load();
</script>
</body>
</html>
