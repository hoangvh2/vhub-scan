name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI starts and the dashboard page is bundled
        run: |
          node packages/pipeline/dist/cli.js help
          test -f packages/pipeline/dist/web/index.html

  cloud:
    name: Terraform plan (no credentials), Firestore rules and sync (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - uses: actions/setup-java@v4 # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Terraform fmt and validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Terraform plan without Google credentials
        # A dummy access token lets the providers configure; with no state and no data sources the plan
        # makes no API calls, so this proves the configuration is complete without a real project.
        working-directory: infra
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: offline-plan-not-a-real-token
        run: |
          terraform plan -input=false -refresh=false -lock=false -var project_id=vhub-trend-ci-000 -var 'allowed_emails=["ci@example.com"]' -var 'android_sha1=["AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01"]' -no-color | tee plan.txt
          grep -q "Plan: 19 to add, 0 to change, 0 to destroy." plan.txt
      - name: Install
        run: |
          npm ci
          npm ci --prefix tests
          npx --prefix tests playwright install --with-deps chromium
      - name: Firestore rules, PC-phone sync and hosted dashboard against the emulators
        run: npm test --prefix tests

  dashboard:
    name: Dashboard screenshots (desktop + phone, light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix tests
          npx --prefix tests playwright install --with-deps chromium
      - name: Render with sample data; fail on console errors or horizontal overflow
        run: npm run screens --prefix tests -- "$PWD/dashboard-screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screens
          path: dashboard-screens/
          if-no-files-found: ignore
