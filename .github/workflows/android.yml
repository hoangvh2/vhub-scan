name: Android

on:
  push:
    paths: &paths
      - "android/**"
      - "docs/contract/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release (needs the signing secrets)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Tests, lint, signed release APK, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signing: ${{ steps.key.outputs.kind }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets (or a throwaway key when they are not set)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from repository secrets."
          else
            # Proves the signing pipeline end to end. An APK signed like this installs, but cannot update
            # an install signed with another key, so it is never published.
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass ci-throwaway -keypass ci-throwaway \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 2 -dname "CN=VHub Trend CI throwaway key" -noprompt
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set: this APK is signed with a throwaway key. See android/README.md to add yours."
          fi

      - name: Build and test
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ci-throwaway' }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'throwaway' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ci-throwaway' }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify the APK signature
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          cp "$apk" "VHubTrend-${VERSION_NAME}-${{ steps.key.outputs.kind }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VHubTrend-apk-${{ steps.key.outputs.kind }}
          path: |
            android/VHubTrend-*.apk
            android/apk-signature.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

  release:
    name: Publish APK
    needs: build
    # Only real-key builds are published: on every push to main, or on "Run workflow" with publish ticked.
    if: needs.build.outputs.signing == 'release' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VHubTrend-apk-release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: VHub Trend Android ${{ env.VERSION_NAME }}
          make_latest: true
          files: VHubTrend-*.apk
          body: |
            Cài trên điện thoại: mở trang này bằng trình duyệt điện thoại → tải file .apk → mở file → cho phép "Cài ứng dụng không rõ nguồn gốc" nếu được hỏi.
            Bản mới cài đè bản cũ, giữ nguyên ghép nối và dữ liệu.
            Commit: ${{ github.sha }}
