name: Android

on:
  push:
    paths: &paths
      - "android/**"
      - "docs/contract/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release (needs the signing secrets)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Tests, lint, signed release APK, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signing: ${{ steps.key.outputs.kind }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets (or a throwaway key when they are not set)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from repository secrets."
          else
            # Proves the signing pipeline end to end. An APK signed like this installs, but cannot update
            # an install signed with another key, so it is never published.
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass ci-throwaway -keypass ci-throwaway \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 2 -dname "CN=VHub Trend CI throwaway key" -noprompt
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set: this APK is signed with a throwaway key. See android/README.md to add yours."
          fi

      - name: Build and test
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ci-throwaway' }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'throwaway' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ci-throwaway' }}
          # Firebase project identifiers for Google sign-in (not secrets): Settings > Secrets and variables > Actions > Variables.
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID }}
          FIREBASE_OWNER_UID: ${{ vars.FIREBASE_OWNER_UID }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify the APK signature
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID }}
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          cp "$apk" "VHubTrend-${VERSION_NAME}-${{ steps.key.outputs.kind }}.apk"
          # Google sign-in on the phone only works for a certificate registered in Firebase (infra/README.md, step 8).
          sha1=$(grep -m1 "certificate SHA-1 digest" apk-signature.txt | sed 's/.*: //' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "### Signing certificate SHA-1 (${{ steps.key.outputs.kind }} key)"
            echo
            echo "\`$sha1\`"
            echo
            if [ "${{ steps.key.outputs.kind }}" = release ]; then echo "Copy it into \`android_sha1\` in infra/terraform.tfvars, then run \`terraform apply\`."; else echo "This is a throwaway key: do not register it."; fi
            if [ -z "${FIREBASE_PROJECT_ID}${FIREBASE_API_KEY}${FIREBASE_WEB_CLIENT_ID}" ]; then echo; echo "> The FIREBASE_* repository variables are not set: this APK has no cloud and shows a setup message instead of the sign-in button."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: VHubTrend-apk-${{ steps.key.outputs.kind }}
          path: |
            android/VHubTrend-*.apk
            android/apk-signature.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

  screens:
    name: Publish screenshots to a browsable branch
    needs: build
    # Artifacts are zips; this keeps the latest PNGs viewable in the browser (and on a phone) at
    # https://github.com/<repo>/tree/android-screenshots. Separate job so Gradle never runs with a write token.
    if: always() && needs.build.result != 'cancelled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-screenshots
          path: shots
      - name: Push to the android-screenshots branch
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cd shots
          { echo "# Android screenshots"; echo; echo "Branch \`$REF\`, commit ${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}."; echo;
            for f in *.png; do echo "## ${f%.png}"; echo; echo "<img src=\"$f\" width=\"360\">"; echo; done; } > README.md
          git init -q -b android-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-screenshots

  release:
    name: Publish APK
    needs: build
    # Only real-key builds are published: on every push to main, or on "Run workflow" with publish ticked.
    if: needs.build.outputs.signing == 'release' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VHubTrend-apk-release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: VHub Trend Android ${{ env.VERSION_NAME }}
          make_latest: true
          files: VHubTrend-*.apk
          body: |
            Cài trên điện thoại: mở trang này bằng trình duyệt điện thoại → tải file .apk → mở file → cho phép "Cài ứng dụng không rõ nguồn gốc" nếu được hỏi.
            Bản mới cài đè bản cũ, giữ nguyên đăng nhập và dữ liệu.
            Commit: ${{ github.sha }}
